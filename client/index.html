<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bare fallback for the instant before React/Helmet mounts (and for
         prerendering's fail-safe skip path) — description, OG/Twitter,
         canonical, and robots are all owned by the <Seo> component (see
         App.tsx's site-wide default plus each page's own override) rather
         than duplicated here, since Helmet can only ever replace tags it
         rendered itself, never ones already sitting in the static HTML. -->
    <title>Gara</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Gara",
        "url": "https://garafoods.com/",
        "logo": "https://garafoods.com/logo/gara-icon-256.png",
        "description": "Homemade pickles, sweets, and snacks made in real kitchens, in small batches, delivered fresh to your door.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-62817-76748",
          "contactType": "customer service",
          "email": "Contact.garafoods@gmail.com"
        },
        "areaServed": [
          { "@type": "City", "name": "Tadepalligudem" },
          { "@type": "City", "name": "Bengaluru" }
        ],
        "sameAs": ["https://www.instagram.com/thegarafoods/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
