# Production-hardening reference config. Terms used below assume the
# recommended architecture: Internet -> Nginx (this file) -> React static
# build + reverse-proxied /api -> Node -> MongoDB, with MongoDB never
# reachable directly from the internet. TLS is scaffolded but commented out
# by default (see the bottom) since it needs a real certificate — local/dev
# runs plain HTTP; a real deployment should uncomment that block (or let
# the hosting platform's own load balancer terminate TLS in front of this).

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# gzip: gives most of the win here; Cloudinary already handles image
# compression/format/CDN delivery (see the design doc's image-performance
# decision) — this is for the JS/CSS/HTML bundle and API JSON responses.
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;

    # Applies to every response from this server block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Adjust connect-src if the API is ever served from a different origin
    # than this Nginx instance (it shouldn't be, in the recommended setup).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://res.cloudinary.com data:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Reject absurdly large request bodies at the edge, before they ever
    # reach Node — a second layer behind Express's own express.json({limit}).
    client_max_body_size 10m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # The SPA shell itself must always revalidate (so a deploy is seen
        # immediately); hashed static assets (JS/CSS from the Vite build)
        # are safe to cache hard, since a new deploy changes their filename.
        location ~* \.(?:js|css|woff2?)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        # Only Nginx should ever see the Node service directly — 'server'
        # here is the Docker Compose service name, not reachable from the
        # internet on its own (see docker-compose.prod.yml, which drops
        # the host port mapping this file's dev compose still exposes for
        # local debugging convenience).
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- TLS (uncomment for a real deployment with a real certificate) ---
# Do NOT uncomment this with the placeholder paths below — either mount a
# real certificate (e.g. via certbot/Let's Encrypt, or your host's cert
# manager) at these paths, or terminate TLS at your cloud load balancer
# instead and drop this block entirely.
#
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl http2;
#     server_name yourdomain.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#     # ... same location blocks as the port-80 server above ...
