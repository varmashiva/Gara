# Secure-by-default base file: neither mongo nor the Node server publish a
# host port here — only `client` (Nginx) is internet-facing, matching
# "MongoDB should never be publicly reachable" and "don't expose Node
# directly". For local development, layer docker-compose.dev.yml on top to
# get direct port access for debugging:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# For production, run this file alone (plus a real TLS cert mounted into
# nginx.conf's commented-out 443 block, or TLS terminated at your cloud
# load balancer in front of the client service):
#
#   docker compose up -d
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo --eval
      "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - with-redis

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    env_file:
      - server/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/marketplace?replicaSet=rs0

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo_data:
